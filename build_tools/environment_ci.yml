# CPU-only environment for CI (GitHub Actions), derived from environment.yml:
# no CUDA pins, a CPU PyTorch build, and no nnpops. PLUMED, openmm-plumed,
# and py-plumed are built by build_plumed.sh against this OpenMM version.
# Python, OpenMM, and OpenMM-ML are pinned to the oldest supported versions.
#
# It also keeps the git dependencies that environment.yml drops. A runner has only
# this repository checked out, so there are no sibling checkouts for
# editable_repos.sh to install from and CI takes them straight from GitHub instead.
name: openmmnqe-ci

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.12
  - pip
  - pytest
  - pytest-cov
  - pandas
  - matplotlib
  - mdanalysis
  - mdtraj
  - pdbfixer
  - "pytorch=*=cpu*"
  - pymace>=0.3.16
  - ase>=3.28.0
  - openmm=8.6.1
  - openmm-ml=1.8
  - openmmforcefields
  # forcefill's gaff backend runs the antechamber and parmchk2 executables, which
  # exist only as a conda package. openmmforcefields already depends on ambertools,
  # but a dependency that is relied on should be declared rather than inherited.
  - ambertools

  # Build PLUMED and its bindings against the selected OpenMM minor version;
  # the prebuilt conda-forge plugin is pinned to an older OpenMM ABI.
  - cmake
  - make
  - cxx-compiler
  - swig
  - doxygen
  - cython

  - pip:
      - torch-dftd
      - git+https://github.com/LouieSlocombe/geodesic_interpolate.git
      - git+https://github.com/LouieSlocombe/forcefill.git
      - git+https://github.com/LouieSlocombe/reactiontools.git
