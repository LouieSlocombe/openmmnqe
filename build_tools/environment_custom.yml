name: openmmnqe_custom

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.13
  - pip
  - pytest
  - pytest-cov
  - "pytorch=*=cuda*"
  - pymace=0.3.15
  - ase=3.28.0
  - openmm=8.6.1
  - openmm-ml=1.8
  - openmmforcefields=0.15.1
  # forcefill's gaff backend runs the antechamber and parmchk2 executables, which
  # exist only as a conda package. openmmforcefields already depends on ambertools,
  # but a dependency that is relied on should be declared rather than inherited.
  - ambertools
  - pdbfixer
  - mdanalysis

  # --- Build Tools ---
  - doxygen
  - swig
  - cython

  - pip:
      - torch-dftd

# forcefill and reactiontools are deliberately absent: custom_install.sh clones them
# next to this repository and installs them editable (see editable_repos.sh).
# Creating this environment on its own leaves them out, and `pip install -e ..`
# then takes their releases from PyPI, at the versions pyproject.toml declares.
# reactiontools brings jax and jaxlib with it, from PyPI -- neither is pinned here.
