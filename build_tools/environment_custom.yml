name: openmmnqe_custom

channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults

dependencies:
  - python=3.13
  - pip
  - pytest

  # --- ML Stack ---
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1

  # --- Scientific Stack ---
  - numpy
  - pandas
  - scipy
  - matplotlib
  - mdanalysis
  - rdkit
  - ase
  - pymace

  # --- Build Tools ---
  - cmake
  - cython