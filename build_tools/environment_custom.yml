name: openmmnqe_custom

channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults

dependencies:
  # --- Core Environment ---
  - python=3.13.*
  - pip
  - pytest
  - setuptools
  - wheel

  # --- ML / GPU Stack ---
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - cuda-toolkit

  # --- Scientific Python Stack ---
  - numpy
  - pandas
  - scipy
  - matplotlib
  - mdanalysis
  - sympy
  - rdkit
  - pymace
  - ase

  # --- Build Tools & Compilers (Crucial for OpenMM/PLUMED) ---
  - compilers
  - cmake
  - make
  - ninja
  - cython
  - swig
  - doxygen
  - pkg-config
  - sysroot_linux-64

  # --- Math & Core Libraries ---
  - zlib
  - mkl
  - mkl-include
  - libblas
  - liblapack

  # --- Downstream Dependencies ---
  - openmmforcefields
  - pdbfixer