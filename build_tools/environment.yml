name: openmmnqe

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python>=3.12
  - pip
  - pytest
  - pytest-cov
  - pandas
  - matplotlib
  - mdanalysis
  - mdtraj
  - pdbfixer
  - "cuda-version<=13.2"
  - "pytorch=*=cuda*"
  - pymace>=0.3.16
  - nnpops
  - ase>=3.28.0
  - openmm>=8.5.1
  - openmm-ml>=1.6
  - openmmforcefields
  # forcefill's gaff backend runs the antechamber and parmchk2 executables, which
  # exist only as a conda package. openmmforcefields already depends on ambertools,
  # but a dependency that is relied on should be declared rather than inherited.
  - ambertools

  # --- Build tools, for build_plumed.sh ---
  - cmake
  - make
  - cxx-compiler
  - swig
  - doxygen
  # build_py_plumed regenerates the py-plumed C extension from its .pyx source.
  - cython

  - pip:
      - torch-dftd

# forcefill, reactiontools, geodesic_interpolate and sella are deliberately absent:
# conda_install.sh clones them next to this repository and installs them editable
# (see editable_repos.sh). Creating this environment on its own leaves them out, and
# `pip install -e ..` then pulls them from git, as pyproject.toml declares them.
# sella brings jax and jaxlib with it, from PyPI -- neither is pinned here.
