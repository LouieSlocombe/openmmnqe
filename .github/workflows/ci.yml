name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check .
      - run: mypy

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      # No conda and no package install: docs/conf.py mocks the conda-only and
      # git-only dependencies, exactly as the Read the Docs build does. Keeping
      # the two identical means a green job here is a green build there.
      - run: pip install -r docs/requirements.txt
      # nitpicky comes from conf.py, so -n is not repeated here.
      - run: sphinx-build -b html -W --keep-going docs docs/_build/html

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # -l so every step runs in the activated micromamba environment
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: build_tools/environment_ci.yml
          cache-environment: true
      # Rebuild on every run, including cache hits, so the plugin and Python
      # bindings always match OpenMM and the shared PLUMED source pins.
      - name: Build PLUMED and its bindings
        run: |
          set -eo pipefail
          source build_tools/build_plumed.sh
          plumed_build_dir="$(mktemp -d "${RUNNER_TEMP}/openmmnqe-plumed.XXXXXX")"
          build_plumed "${plumed_build_dir}"
          build_py_plumed "${plumed_build_dir}"
          plumed --no-mpi config -q module opes
          python -c "import plumed; plumed.Plumed()"
          python -c "from openmmplumed import PlumedForce"
      - name: Verify OpenMM and OpenMM-ML baselines
        run: |
          python - <<'PY'
          from importlib.metadata import version
          assert version('openmm') == '8.6.1', version('openmm')
          assert version('openmmml') == '1.8', version('openmmml')
          PY
      - run: pip install -e . --no-deps
      - run: python -c "import openmmnqe; print(openmmnqe.__version__)"
      - run: pytest tests --cov=openmmnqe --cov-branch --cov-report=term-missing --cov-fail-under=90 -q
