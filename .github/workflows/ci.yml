name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check .
      - run: mypy

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      # No conda and no package install: docs/conf.py mocks the conda-only
      # dependencies, exactly as the Read the Docs build does. Keeping the two
      # identical means a green job here is a green build there.
      - run: pip install -r docs/requirements.txt
      # nitpicky comes from conf.py, so -n is not repeated here.
      - run: sphinx-build -b html -W --keep-going docs docs/_build/html

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      # Conda cache restores can change compiler mtimes without changing it.
      CCACHE_COMPILERCHECK: content
    defaults:
      run:
        # -l so every step runs in the activated micromamba environment
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: build_tools/environment_ci.yml
          cache-environment: true
      - name: Cache PLUMED compilation
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-plumed-ccache-v1-${{ hashFiles('build_tools/environment_ci.yml', 'build_tools/build_plumed.sh', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-plumed-ccache-v1-${{ hashFiles('build_tools/environment_ci.yml', 'build_tools/build_plumed.sh', '.github/workflows/ci.yml') }}-
      # Rebuild on every run, including cache hits, so the plugin and Python
      # bindings always match OpenMM and the shared PLUMED source pins. ccache
      # reuses only compilations whose source, headers and compiler still match.
      - name: Build PLUMED and its bindings
        run: |
          set -eo pipefail
          source build_tools/build_plumed.sh
          # Keep source paths stable across the fresh hosted runners for ccache.
          plumed_build_dir="${RUNNER_TEMP}/openmmnqe-plumed"
          mkdir -p "${plumed_build_dir}"
          ccache --zero-stats
          build_plumed "${plumed_build_dir}" ccache
          build_py_plumed "${plumed_build_dir}"
          check_plumed_installation python
      - name: Report compiler cache usage
        if: always()
        run: ccache --show-stats
      - name: Verify OpenMM and OpenMM-ML baselines
        run: |
          python - <<'PY'
          from importlib.metadata import version
          assert version('openmm') == '8.6.1', version('openmm')
          assert version('openmmml') == '1.8', version('openmmml')
          PY
      - run: pip install -e . --no-deps
      - run: python -c "import openmmnqe; print(openmmnqe.__version__)"
      - run: pytest tests --cov=openmmnqe --cov-branch --cov-report=term-missing --cov-fail-under=90 --durations=20 -q
