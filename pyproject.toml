[build-system]
requires = ["setuptools>=66.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmmnqe"
version = "0.1.0"
description = "OpenMM workflows for nuclear quantum effects: RPMD and adaptive QTB simulations with PLUMED enhanced sampling"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]

dependencies = [
    "numpy>=2.0",  # np.trapezoid in openmmnqe.rates
    "scipy",
    "openmm>=8.6.1",
    "openmmml>=1.8",  # conda-forge: openmm-ml (not on PyPI) -- module-level import in openmmnqe/openmm.py
    "openmmplumed>=2.0.1",  # conda-forge: openmm-plumed; 2.0.1 fixes force accumulation
    "ase",
    "pdbfixer",      # openmmnqe.io.fix_pdb -- forcefill is subtractive only and will not repair
    "rdkit",         # openmmnqe.io.xyz_to_sdf and convert_sdfs_to_pdb
    "mace-torch",
    # Ligand parameterisation: the non-standard residues of a structure to an
    # OpenMM ffxml, via AmberTools GAFF/AM1-BCC. The antechamber and parmchk2
    # executables it shells out to are conda-only -- see build_tools/.
    "forcefill @ git+https://github.com/LouieSlocombe/forcefill.git",
    # reactiontools reads a steered trajectory back as a reference path -- a step
    # of these workflows -- and depends on mdtraj to do it, so mdtraj arrives
    # here transitively. The [traj] extra asks for it directly all the same:
    # openmmnqe.openmm's 'h5' trajectory format imports it in its own right, and
    # a documented feature should not rest on another package's dependency list.
    "reactiontools @ git+https://github.com/LouieSlocombe/reactiontools.git",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
plot = [
    "matplotlib",
]
# The 'h5' trajectory format, the only one carrying velocities and topology in
# one file. DCD and XTC need nothing beyond OpenMM.
traj = [
    "mdtraj",
    "tables",  # MDTraj's HDF5 reporter requires PyTables
]
dev = [
    "pytest",
    "pytest-cov",
    "matplotlib",
    "mypy",
]
# Kept byte-identical to docs/requirements.txt, which Read the Docs installs
# instead of this extra -- RTD cannot request an extra without also installing
# the project, and openmmnqe's runtime dependencies are not pip-installable.
# tests/test_package_metadata.py asserts the two lists agree. numpy and scipy
# are restated here even though they are hard dependencies, so that equality
# check is a plain comparison.
docs = [
    "sphinx>=8.2,<10",
    "furo>=2024.8.6",
    "myst-parser>=4,<6",
    "sphinx-copybutton>=0.5.2",
    "numpy>=2.0",
    "scipy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "forcefield: parameterises a ligand through forcefill; needs AmberTools (antechamber, parmchk2) on PATH",
]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/openmmnqe"
Repository = "https://github.com/LouieSlocombe/openmmnqe"

[tool.ruff.lint]
select = ["F", "E9", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["openmmnqe"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["openmmnqe", "openmmnqe.*"]
