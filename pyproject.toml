[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmmnqe"
version = "0.1.0"
description = "OpenMM workflows for nuclear quantum effects: RPMD and adaptive QTB simulations with PLUMED enhanced sampling"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "torch",
    "openmm",
    "mdtraj",  # openmmnqe/path.py, openmmnqe/plumed.py
    "MDAnalysis",  # openmmnqe/io.py
    "ase",
    "openmmforcefields",
    "pdbfixer",
    "rdkit",
    "mace-torch",
    "openff-toolkit",  # openmmnqe/io.py
    # Reaction paths, ORCA and free-energy-surface plotting live here; it also
    # brings in geodesic_interpolate.
    "reactiontools @ git+https://github.com/LouieSlocombe/reactiontools.git",
]
# Required at runtime but not installable from PyPI (install via conda, see
# build_tools/environment.yml): openmm-ml, openmm-plumed.

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pandas",  # tests/test_openmm.py bias-weight tables
    "scikit-learn",  # tests/test_openmm.py PCA reaction-coordinate analysis
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/openmmnqe"
Repository = "https://github.com/LouieSlocombe/openmmnqe"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["openmmnqe", "openmmnqe.*"]