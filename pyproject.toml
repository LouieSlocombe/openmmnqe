[build-system]
requires = ["setuptools>=66.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmmnqe"
version = "1.1.0"
description = "OpenMM workflows for nuclear quantum effects: RPMD and adaptive QTB simulations with PLUMED enhanced sampling"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]

dependencies = [
    "numpy>=2.0",  # np.trapezoid in openmmnqe.rates
    "scipy",
    "openmm>=8.6.1",
    "openmmml>=1.8",  # conda-forge: openmm-ml (not on PyPI) -- module-level import in openmmnqe/openmm.py
    "openmmplumed>=2.0.1",  # conda-forge: openmm-plumed; 2.0.1 fixes force accumulation
    "ase",
    "pdbfixer",      # openmmnqe.io.fix_pdb -- forcefill is subtractive only and will not repair
    "rdkit",         # openmmnqe.io.xyz_to_sdf and convert_sdfs_to_pdb
    "mace-torch",
    # Ligand parameterisation: the non-standard residues of a structure to an
    # OpenMM ffxml, via AmberTools GAFF/AM1-BCC. The antechamber and parmchk2
    # executables it shells out to are conda-only -- see build_tools/. The
    # floor is what CI installs; the local installers put an editable sibling
    # checkout in its place.
    "forcefill>=1.0",
    # Reaction paths, PLUMED inputs and free-energy plotting. It depends on
    # mdtraj, so mdtraj arrives transitively; the [traj] extra still asks for
    # it directly because the 'h5' trajectory format imports it in its own right.
    "reactiontools>=1.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
plot = [
    "matplotlib",
]
# The 'h5' trajectory format, the only one carrying velocities and topology in
# one file. DCD and XTC need nothing beyond OpenMM.
traj = [
    "mdtraj",
    "tables",  # MDTraj's HDF5 reporter requires PyTables
]
dev = [
    "pytest",
    "pytest-cov",
    "matplotlib",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "forcefield: parameterises a ligand through forcefill; needs AmberTools (antechamber, parmchk2) on PATH",
]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/openmmnqe"
Repository = "https://github.com/LouieSlocombe/openmmnqe"

[tool.ruff.lint]
select = ["F", "E9", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["openmmnqe"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.setuptools.packages.find]
where = ["."]
include = ["openmmnqe", "openmmnqe.*"]
