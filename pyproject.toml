[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmmnqe"
version = "0.1.0"
description = "OpenMM workflows for nuclear quantum effects: RPMD and adaptive QTB simulations with PLUMED enhanced sampling"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]

dependencies = [
    "numpy",
    "scipy",
    "openmm",
    "openmmml",      # conda-forge: openmm-ml (not on PyPI) -- module-level import in openmmnqe/openmm.py
    "openmmplumed",  # conda-forge: openmm-plumed (dist name OpenMMPlumed) -- same
    "ase",
    "pdbfixer",      # openmmnqe.io.fix_pdb -- forcefill is subtractive only and will not repair
    "rdkit",         # openmmnqe.io.xyz_to_sdf and convert_sdfs_to_pdb
    "mace-torch",
    # Ligand parameterisation: the non-standard residues of a structure to an
    # OpenMM ffxml, via AmberTools GAFF/AM1-BCC. The antechamber and parmchk2
    # executables it shells out to are conda-only -- see build_tools/.
    "forcefill @ git+https://github.com/LouieSlocombe/forcefill.git",
    # The [path] extra pulls in mdtraj, which reactiontools needs to read a
    # steered trajectory back as a reference path -- a step of these workflows.
    "reactiontools[path] @ git+https://github.com/LouieSlocombe/reactiontools.git",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
plot = [
    "matplotlib",
]
dev = [
    "pytest",
    "pytest-cov",
    "matplotlib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "forcefield: parameterises a ligand through forcefill; needs AmberTools (antechamber, parmchk2) on PATH",
]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/openmmnqe"
Repository = "https://github.com/LouieSlocombe/openmmnqe"

[tool.ruff.lint]
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
"openmmnqe/__init__.py" = ["F401"]  # re-export module until __all__ lands

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["openmmnqe", "openmmnqe.*"]
